name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags: cli/deployrepo_test.go (mallcoppro-f19) does
          # `git show v0.19.0:cli/deployrepo.go` to render a real historical
          # workflow artifact for the stamp/divergence tests. The default
          # fetch-depth:1, fetch-tags:false checkout fetches zero tags, so
          # that tag ref is unresolvable and the test fails under CI's
          # default shallow clone even though it passes on a normal
          # developer checkout (which already has tags locally).
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Doc-test harness (mallcoppro-cec) — every README/docs terminal demo vs the real binary
        run: go test -tags docdemo -count=1 -v ./test/docdemo/...

      - name: E2E harness (mallcoppro-8ac) — the built binary against a canned inference backend, consensus ON
        # cli/scan_e2e_test.go is //go:build e2e — it never runs under the bare
        # `go test ./...` above, so it was silently skipped by CI until this step.
        # Offline/deterministic: cannedbackend is an in-process fake
        # Anthropic-compatible server (no network, no real credentials, no cost),
        # so this runs unconditionally on every push/PR, not gated behind
        # secrets. It builds the real cmd/mallcop binary and drives it through
        # `mallcop scan` end to end with the production consensus gate on
        # (scan.go's agent.DefaultConsensusRuns=3 — not overridden by the test).
        run: go test -tags e2e -count=1 -v ./cli/...

      - name: Operator-integration capstone (mallcoppro-b1b) — the whole sense→persist→feed-forward loop on one real store
        # test/capstone/operator_loop_test.go is //go:build capstone — it never
        # runs under the bare `go test ./...` above (the real validate-proposal
        # gate subprocess it drives is heavy), so it needs its own step or it is
        # silently skipped. Offline/deterministic: real git-backed store, real
        # detector scans, real record_decision tool, real DirectiveDispatcher,
        # real collect.DetectorGaps, real proposer (canned inference reply only),
        # and a real `mallcop validate-proposal` gate built from this checkout —
        # no network, no credentials, no cost.
        run: go test -tags capstone -count=1 -v -timeout 600s ./test/capstone/...

      - name: Vet
        run: go vet ./...
